<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyMail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col justify-between">

    <!-- Navigatie -->
    <header class="max-w-5xl mx-auto w-full px-6 py-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </div>
            <span class="text-xl font-bold tracking-tight text-white">EasyMail</span>
        </div>

        <button 
            onclick="openBot()" 
            class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/15 border border-white/10 text-sm font-semibold transition cursor-pointer"
        >
            Open AI Bot
        </button>
    </header>

    <!-- Centrale Sectie -->
    <main class="max-w-3xl mx-auto px-6 text-center my-auto py-12">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs font-medium mb-6">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            Status: Nog niet gekoppeld
        </div>

        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white mb-6">
            EasyMail AI
        </h1>

        <p class="text-slate-400 text-base sm:text-lg mb-10 max-w-md mx-auto">
            Start hier jouw AI-assistent.
        </p>

        <button 
            onclick="openBot()" 
            class="px-8 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-cyan-500 hover:from-indigo-500 hover:to-cyan-400 text-white font-bold text-lg shadow-xl shadow-indigo-500/25 transition-all transform hover:-translate-y-0.5 inline-flex items-center gap-3 cursor-pointer"
        >
            <span>Ga naar AI Bot</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
        </button>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-600">
        &copy; 2026 EasyMail
    </footer>

    <!-- Melding als de bot nog niet gelinkt is -->
    <div id="customModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/80 backdrop-blur-sm p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl">
            <div class="w-12 h-12 rounded-full bg-amber-500/10 text-amber-400 flex items-center justify-center mx-auto mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                </svg>
            </div>
            <h3 class="text-lg font-bold text-white mb-2">Bot nog niet gelinkt</h3>
            <p class="text-sm text-slate-400 mb-6">
                Deze AI-bot is nog niet gekoppeld aan een URL.
            </p>
            <button 
                onclick="closeModal()" 
                class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold transition cursor-pointer"
            >
                Sluiten
            </button>
        </div>
    </div>

    <script>
        // Vul hier later de link naar jouw AI-bot in tussen de aanhalingstekens
        const botUrl = ""; 

        function openBot() {
            if (botUrl && botUrl.trim() !== "") {
                window.open(botUrl, '_blank', 'noopener,noreferrer');
            } else {
                const modal = document.getElementById('customModal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            }
        }

        function closeModal() {
            const modal = document.getElementById('customModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
