<!DOCTYPE html>
<html lang="nl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyMail — Slimme AI E-mail Sorter</title>
    <!-- Tailwind CSS voor styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        oled: 'rgba(0, 0, 0, 0.45)', /* Transparant gemaakt voor de video */
                        surface: 'rgba(10, 10, 12, 0.65)', /* Glassmorphism effect */
                        surfaceHover: 'rgba(20, 20, 24, 0.8)',
                        borderDark: 'rgba(255, 255, 255, 0.1)',
                        midnight: '#060b19',
                        midnightSurface: '#0c152e'
                    }
                }
            }
        }
    </script>
    <style>
        /* Live YouTube Achtergrond Styling */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -10;
            overflow: hidden;
            pointer-events: none;
            background: #000;
        }
        .video-background iframe {
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.05); /* Lichte zoom om eventuele YouTube-randjes weg te werken */
        }
        /* Donkere overlay zodat witte tekst altijd goed leesbaar blijft */
        .video-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            z-index: -5;
            pointer-events: none;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Midnight Blue Thema overrides (ook licht transparant) */
        html.theme-midnight body,
        html.theme-midnight main {
            background-color: rgba(5, 10, 24, 0.55) !important;
        }
        html.theme-midnight aside,
        html.theme-midnight header,
        html.theme-midnight #utility-drawer {
            background-color: rgba(10, 18, 41, 0.75) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }
    </style>
</head>
<body class="bg-transparent text-gray-900 dark:text-zinc-100 font-sans antialiased transition-colors duration-300 h-screen overflow-hidden flex flex-col">

    <!-- YOUTUBE LIVE WALLPAPER ACHTERGROND -->
    <div class="video-background">
        <iframe 
            src="https://www.youtube.com/embed/PxsmqFWmLtg?autoplay=1&mute=1&loop=1&playlist=PxsmqFWmLtg&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&disablekb=1" 
            frameborder="0" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>
    </div>
    <div class="video-overlay"></div>

    <!-- Hoofdcontainer -->
    <div class="flex flex-1 h-full overflow-hidden relative">

        <!-- LINKER ZIJBALK (Met backdrop-blur-md voor glassmorphism) -->
        <aside id="ai-sidebar" class="w-full md:w-72 lg:w-80 bg-white/80 dark:bg-surface backdrop-blur-md border-r border-gray-200 dark:border-borderDark flex flex-col p-4 transition-all duration-300 z-30 hidden md:flex overflow-y-auto no-scrollbar">
